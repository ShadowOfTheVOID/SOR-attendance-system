<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Attendance Admin</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <h1>Attendance admin</h1>
  <p class="sub"><a href="./">← Check-in</a> · <a href="display.html">Display</a></p>
  <section class="card" id="auth"></section>

  <section class="card signed-in hidden">
    <div class="row">
      <div><label for="date">Date</label><input id="date" type="date"></div>
      <div><label for="shift">Shift</label><select id="shift"></select></div>
    </div>
    <button class="btn secondary" id="load">Load</button>
    <div id="msg" class="msg"></div>

    <div id="day" class="hidden">
      <div class="summary" id="summary"></div>
      <div class="bulk">
        <span>Set everyone still "Not Present" to:</span>
        <button data-bulk="Absent Unexcused">Absent Unexcused</button>
      </div>
      <table>
        <thead><tr><th>Name</th><th>Status</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
      <button class="btn" id="save">Save changes</button>
    </div>
  </section>
</main>

<script src="config.js"></script>
<script type="module">
  import { $, api, esc, setMsg, requireSignIn } from './app.js';

  let statuses = [], data = null, edits = {};

  const statusOf = (m) => (m.name in edits ? edits[m.name] : m.status);

  function setStatus(name, status) {
    const m = data.members.find((x) => x.name === name);
    if (m.status === status) delete edits[name]; else edits[name] = status;
  }

  function render() {
    if (!data) return;
    $('rows').innerHTML = data.members.map((m) => {
      const s = statusOf(m);
      return `<tr class="${m.name in edits ? 'changed' : ''}">
        <td>${esc(m.name)}</td>
        <td><select data-name="${esc(m.name)}">${statuses.map((o) =>
          `<option${o === s ? ' selected' : ''}>${esc(o)}</option>`).join('')}</select></td></tr>`;
    }).join('');
    const counts = Object.fromEntries(statuses.map((k) => [k, 0]));
    data.members.forEach((m) => { const s = statusOf(m); counts[s in counts ? s : 'Not Present']++; });
    $('summary').innerHTML = Object.entries(counts)
      .map(([k, v]) => `<span class="pill">${esc(k)}: ${v}</span>`).join('');
  }

  async function loadShifts() {
    $('shift').innerHTML = '';
    try {
      const s = await api('shifts', { date: $('date').value });
      $('shift').innerHTML = s.shifts.length
        ? s.shifts.map((x) => `<option value="${esc(x.key)}"${x.key === s.defaultKey ? ' selected' : ''}>${esc(x.label)}</option>`).join('')
        : '<option value="">No shifts on this date</option>';
    } catch (e) {
      setMsg($('msg'), 'err', e.message);
    }
  }

  async function load(quiet) {
    if (!$('shift').value) return setMsg($('msg'), 'warn', 'Pick a shift.');
    if (!quiet && Object.keys(edits).length && !confirm('Discard unsaved changes?')) return;
    if (!quiet) setMsg($('msg'), 'ok', 'Loading…');
    try {
      data = await api('getShift', { date: $('date').value, shiftKey: $('shift').value });
      edits = {};
      if (!quiet) $('msg').className = 'msg';
      $('day').classList.remove('hidden');
      render();
    } catch (e) {
      setMsg($('msg'), 'err', e.message);
    }
  }

  async function save() {
    const records = Object.entries(edits).map(([name, status]) => ({ name, status }));
    if (!records.length) return setMsg($('msg'), 'warn', 'No changes to save.');
    $('save').disabled = true;
    try {
      const r = await api('saveShift', { date: data.date, shiftKey: data.shift.key, records });
      setMsg($('msg'), 'ok', `Saved ${r.saved} change(s) to the sheet.`);
      await load(true);
    } catch (e) {
      setMsg($('msg'), 'err', e.message);
    } finally {
      $('save').disabled = false;
    }
  }

  $('rows').addEventListener('change', (e) => { setStatus(e.target.dataset.name, e.target.value); render(); });
  document.querySelectorAll('[data-bulk]').forEach((b) => b.addEventListener('click', () => {
    data.members.forEach((m) => { if (statusOf(m) === 'Not Present') setStatus(m.name, b.dataset.bulk); });
    render();
  }));
  $('date').addEventListener('change', async () => { $('day').classList.add('hidden'); data = null; edits = {}; await loadShifts(); });
  $('load').addEventListener('click', () => load(false));
  $('save').addEventListener('click', save);

  requireSignIn(async () => {
    try {
      const me = await api('me');
      if (!me.isAdmin) return setMsg($('msg'), 'err', 'This account is not an admin.');
      statuses = me.statuses;
      if (!$('date').value) $('date').value = me.today;
      await loadShifts();
      if ($('shift').value) load(true);
    } catch (e) {
      setMsg($('msg'), 'err', e.message);
    }
  });
</script>
</body>
</html>
