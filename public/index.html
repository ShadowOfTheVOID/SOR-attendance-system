<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Attendance Check-in</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <h1 id="title">Attendance</h1>
  <p class="sub" id="today"></p>

  <section class="card" id="auth"></section>

  <section class="card signed-in hidden" id="checkin-card">
    <p id="member-line"></p>
    <form id="checkin-form">
      <label for="code">Code on the screen</label>
      <input id="code" class="code" inputmode="numeric" autocomplete="one-time-code"
             maxlength="7" placeholder="000000" required>
      <button class="btn" id="checkin-btn" type="submit">Check in</button>
    </form>
    <div id="msg" class="msg"></div>
  </section>

  <section class="card hidden" id="parent-card">
    <h2 style="margin-top:0;font-size:1.15rem">Parent or mentor?</h2>
    <p class="who">Link this Google account once, then check in with the code like everyone else.
      Students: ask a lead to add your email instead.</p>
    <form id="parent-form">
      <div class="row" role="radiogroup" style="margin-bottom:12px">
        <label class="choice"><input type="radio" name="vrole" value="parent" checked> I'm a parent</label>
        <label class="choice"><input type="radio" name="vrole" value="mentor"> I'm a mentor</label>
      </div>
      <label for="parent-name">Your name</label>
      <select id="parent-name"></select>
      <input id="parent-new" class="hidden" style="margin-top:8px" placeholder="First and last name" autocomplete="name">
      <p class="who hidden" id="mentor-hint" style="margin-top:8px">Not listed? Ask a lead to add you to
        the mentor dropdown in the sheet.</p>
      <div id="child-box">
        <label for="parent-child" style="margin-top:12px">Your student</label>
        <select id="parent-child"></select>
      </div>
      <button class="btn" id="parent-btn" type="submit">Link my account</button>
    </form>
    <div id="parent-msg" class="msg"></div>
  </section>

  <section class="card signed-in hidden" id="admin-links" hidden>
    <b>Admin</b>
    <div class="links"><a href="display.html">Open display (code + QR)</a><a href="admin.html">Edit attendance</a></div>
  </section>
</main>

<script src="config.js"></script>
<script type="module">
  import { $, api, esc, setMsg, requireSignIn } from './app.js';

  const params = new URLSearchParams(location.search);
  const scannedCode = params.get('code');
  if (scannedCode) $('code').value = scannedCode;

  async function submit() {
    const btn = $('checkin-btn');
    btn.disabled = true;
    setMsg($('msg'), 'ok', 'Checking in…');
    try {
      const r = await api('checkIn', { code: $('code').value });
      if (r.role === 'parent' || r.role === 'mentor') {
        setMsg($('msg'), 'ok', r.alreadyMarked
          ? `✓ Thanks, ${r.name}! You're checked in for ${r.shift}.`
          : `✓ Thanks, ${r.name}! You weren't signed up, so you've been added as a ${r.role} for ${r.shift}.`);
      } else if (r.alreadyMarked) setMsg($('msg'), 'warn', `You're already marked ${r.status} for ${r.shift}.`);
      else if (r.status === 'Partial') setMsg($('msg'), 'warn', `${r.name}: marked Partial (late) for ${r.shift}`);
      else setMsg($('msg'), 'ok', `✓ ${r.name}: ${r.status} for ${r.shift}`);
      $('code').value = '';
    } catch (e) {
      setMsg($('msg'), 'err', e.message);
      $('code').value = '';
      $('code').focus();
    } finally {
      btn.disabled = false;
      history.replaceState(null, '', location.pathname); // drop the scanned code from the URL
    }
  }

  $('checkin-form').addEventListener('submit', (e) => { e.preventDefault(); submit(); });

  const NOT_LISTED = '__new__';

  let options = { parents: [], mentors: [], students: [] };
  const vrole = () => document.querySelector('input[name="vrole"]:checked').value;

  function renderVolunteerForm() {
    const mentor = vrole() === 'mentor';
    const names = mentor ? options.mentors : options.parents;
    $('parent-name').innerHTML = '<option value="">Choose your name…</option>' +
      names.map((n) => `<option>${esc(n)}</option>`).join('') +
      (mentor ? '' : `<option value="${NOT_LISTED}">My name isn't listed</option>`);
    $('parent-new').classList.add('hidden');
    $('child-box').classList.toggle('hidden', mentor);
    $('mentor-hint').classList.toggle('hidden', !mentor);
    $('parent-msg').className = 'msg';
  }

  async function showParentSignup() {
    try {
      options = await api('parentOptions');
      $('parent-child').innerHTML = '<option value="">Choose your student…</option>' +
        options.students.map((n) => `<option>${esc(n)}</option>`).join('');
      renderVolunteerForm();
      $('parent-card').classList.remove('hidden');
    } catch (e) {
      setMsg($('msg'), 'err', e.message);
    }
  }

  document.querySelectorAll('input[name="vrole"]').forEach((r) => r.addEventListener('change', renderVolunteerForm));

  $('parent-name').addEventListener('change', () => {
    $('parent-new').classList.toggle('hidden', $('parent-name').value !== NOT_LISTED);
  });

  $('parent-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const picked = $('parent-name').value;
    const name = picked === NOT_LISTED ? $('parent-new').value : picked;
    if (!name) return setMsg($('parent-msg'), 'err', 'Choose your name first.');
    $('parent-btn').disabled = true;
    try {
      if (vrole() === 'mentor') await api('registerMentor', { name });
      else await api('registerParent', { name, child: $('parent-child').value });
      $('parent-card').classList.add('hidden');
      $('checkin-form').classList.remove('hidden');
      $('msg').className = 'msg';
      await loadMe();
    } catch (err) {
      setMsg($('parent-msg'), 'err', err.message);
    } finally {
      $('parent-btn').disabled = false;
    }
  });

  requireSignIn(loadMe);

  async function loadMe() {
    $('parent-card').classList.add('hidden');
    $('checkin-form').classList.remove('hidden');
    try {
      const me = await api('me');
      $('title').textContent = me.orgName + ' Attendance';
      $('today').textContent = 'Today: ' + me.today;
      $('admin-links').hidden = !me.isAdmin;
      if (!me.member) {
        $('member-line').innerHTML = `<b>${esc(me.email)}</b> isn't on the Check-in Roster yet.`;
        $('checkin-form').classList.add('hidden');
        if (me.canRegisterAsParent) showParentSignup();
        return;
      }
      $('member-line').innerHTML = `Hi <b>${esc(me.member.name)}</b>` +
        (me.member.role === 'parent' ? ' (parent volunteer)' : me.member.role === 'mentor' ? ' (mentor)' : '');
      if (!me.selfCheckIn) {
        $('checkin-btn').disabled = true;
        setMsg($('msg'), 'warn', 'Check-in is currently closed.');
        return;
      }
      if (scannedCode) submit();
    } catch (e) {
      setMsg($('msg'), 'err', e.message);
    }
  }
</script>
</body>
</html>
