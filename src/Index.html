<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="utf-8">
<style>
  :root { --bg:#f5f6f8; --card:#fff; --text:#1f2933; --muted:#616e7c; --accent:#1a73e8;
          --border:#d9dde3; --ok:#188038; --warn:#b06000; --err:#c5221f; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
         background:var(--bg); color:var(--text); }
  main { max-width: 720px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 1.5rem; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 20px; }
  .tabs { display:flex; gap:8px; margin-bottom:16px; }
  .tabs button { flex:1; padding:10px; border:1px solid var(--border); background:var(--card);
                 border-radius:8px; font-size:1rem; cursor:pointer; }
  .tabs button.active { background:var(--accent); color:#fff; border-color:var(--accent); }
  .card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:20px; }
  label { display:block; font-weight:600; margin-bottom:6px; }
  input, select { width:100%; padding:12px; font-size:1rem; border:1px solid var(--border);
                  border-radius:8px; background:#fff; color:var(--text); }
  .row { display:flex; gap:8px; flex-wrap:wrap; }
  .row > * { flex:1; min-width:140px; }
  .btn { margin-top:12px; width:100%; padding:14px; font-size:1.05rem; font-weight:600;
         color:#fff; background:var(--accent); border:0; border-radius:8px; cursor:pointer; }
  .btn:disabled { opacity:.6; cursor:default; }
  .btn.secondary { background:#fff; color:var(--accent); border:1px solid var(--accent); }
  .msg { margin-top:14px; padding:12px; border-radius:8px; display:none; }
  .msg.ok { display:block; background:#e6f4ea; color:var(--ok); }
  .msg.warn { display:block; background:#fef7e0; color:var(--warn); }
  .msg.err { display:block; background:#fce8e6; color:var(--err); }
  .hidden { display:none; }
  .summary { display:flex; gap:8px; flex-wrap:wrap; margin:12px 0; }
  .pill { padding:4px 10px; border-radius:999px; font-size:.85rem; background:#eef1f4; }
  table { width:100%; border-collapse:collapse; margin-top:8px; }
  th, td { text-align:left; padding:8px 6px; border-bottom:1px solid var(--border); }
  td select { padding:6px; }
  tr.changed td { background:#fff8e1; }
  .bulk { display:flex; gap:6px; flex-wrap:wrap; margin-top:8px; }
  .bulk button { padding:6px 10px; border:1px solid var(--border); border-radius:6px;
                 background:#fff; cursor:pointer; }
  @media (max-width: 480px) { th:nth-child(3), td:nth-child(3) { display:none; } }
</style>
</head>
<body>
<main>
  <h1 id="title">Attendance</h1>
  <p class="sub" id="today"></p>

  <div class="tabs">
    <button id="tab-checkin" class="active" onclick="showTab('checkin')">Check in</button>
    <button id="tab-admin" onclick="showTab('admin')">Admin</button>
  </div>

  <section id="panel-checkin" class="card">
    <form id="checkin-form" onsubmit="doCheckIn(event)">
      <label for="who">Your ID or full name</label>
      <input id="who" list="names" autocomplete="off" required placeholder="e.g. S001 or Jane Doe">
      <datalist id="names"></datalist>
      <button class="btn" id="checkin-btn" type="submit">Mark me present</button>
    </form>
    <div id="checkin-msg" class="msg"></div>
  </section>

  <section id="panel-admin" class="card hidden">
    <div id="admin-login">
      <label for="pin">Admin PIN</label>
      <input id="pin" type="password" autocomplete="current-password">
    </div>
    <div class="row" style="margin-top:12px">
      <div><label for="date">Date</label><input id="date" type="date"></div>
      <div><label for="filter">Group</label><select id="filter" onchange="renderTable()"></select></div>
    </div>
    <button class="btn secondary" onclick="loadDay()">Load</button>
    <div id="admin-msg" class="msg"></div>

    <div id="admin-day" class="hidden">
      <div class="summary" id="summary"></div>
      <div class="bulk">
        <span>Set all shown unmarked to:</span>
        <button onclick="bulkSet('Present')">Present</button>
        <button onclick="bulkSet('Absent')">Absent</button>
      </div>
      <table>
        <thead><tr><th>Name</th><th>Status</th><th>Group</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
      <button class="btn" id="save-btn" onclick="saveDay()">Save changes</button>
    </div>
  </section>
</main>

<script>
  var config = null;
  var day = null;          // {date, members:[{id,name,group,status}]}
  var edits = {};          // id -> status

  function $(id) { return document.getElementById(id); }
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;", "'": "&#39;" }[c];
    });
  }
  function setMsg(el, kind, text) { el.className = 'msg ' + kind; el.textContent = text; }
  function errText(e) { return (e && e.message) ? e.message.replace(/^Exception:\s*/, '') : String(e); }

  function showTab(name) {
    ['checkin', 'admin'].forEach(function (t) {
      $('tab-' + t).classList.toggle('active', t === name);
      $('panel-' + t).classList.toggle('hidden', t !== name);
    });
  }

  google.script.run
    .withSuccessHandler(function (c) {
      config = c;
      $('title').textContent = c.orgName + ' Attendance';
      $('today').textContent = 'Today: ' + c.today;
      $('date').value = c.today;
      $('names').innerHTML = c.names.map(function (n) {
        return '<option value="' + esc(n) + '">';
      }).join('');
      if (!c.selfCheckIn) {
        $('checkin-btn').disabled = true;
        setMsg($('checkin-msg'), 'warn', 'Self check-in is currently closed.');
      }
    })
    .withFailureHandler(function (e) { setMsg($('checkin-msg'), 'err', errText(e)); })
    .getAppConfig();

  function doCheckIn(ev) {
    ev.preventDefault();
    var btn = $('checkin-btn');
    btn.disabled = true;
    google.script.run
      .withSuccessHandler(function (r) {
        btn.disabled = false;
        $('who').value = '';
        if (r.alreadyMarked) {
          setMsg($('checkin-msg'), 'warn', r.name + ' is already marked ' + r.status + ' today.');
        } else {
          setMsg($('checkin-msg'), r.status === 'Late' ? 'warn' : 'ok',
            r.name + ' marked ' + r.status + ' at ' + r.time + '.');
        }
      })
      .withFailureHandler(function (e) {
        btn.disabled = false;
        setMsg($('checkin-msg'), 'err', errText(e));
      })
      .checkIn($('who').value);
  }

  function loadDay() {
    if (Object.keys(edits).length && !confirm('Discard unsaved changes?')) return;
    setMsg($('admin-msg'), 'ok', 'Loading…');
    google.script.run
      .withSuccessHandler(function (d) {
        day = d; edits = {};
        $('admin-msg').className = 'msg';
        var groups = {};
        d.members.forEach(function (m) { if (m.group) groups[m.group] = true; });
        var current = $('filter').value;
        $('filter').innerHTML = '<option value="">All groups</option>' +
          Object.keys(groups).sort().map(function (g) {
            return '<option' + (g === current ? ' selected' : '') + '>' + esc(g) + '</option>';
          }).join('');
        $('admin-day').classList.remove('hidden');
        renderTable();
      })
      .withFailureHandler(function (e) { setMsg($('admin-msg'), 'err', errText(e)); })
      .adminGetDay($('pin').value, $('date').value);
  }

  function statusOf(m) { return edits.hasOwnProperty(m.id) ? edits[m.id] : m.status; }

  function visibleMembers() {
    var g = $('filter').value;
    return day.members.filter(function (m) { return !g || m.group === g; });
  }

  function renderTable() {
    if (!day) return;
    var opts = [''].concat(config.statuses);
    $('rows').innerHTML = visibleMembers().map(function (m) {
      var s = statusOf(m);
      return '<tr class="' + (edits.hasOwnProperty(m.id) ? 'changed' : '') + '">' +
        '<td>' + esc(m.name) + '<br><small>' + esc(m.id) + '</small></td>' +
        '<td><select data-id="' + esc(m.id) + '" onchange="edit(this)">' +
        opts.map(function (o) {
          return '<option value="' + o + '"' + (o === s ? ' selected' : '') + '>' +
            (o || '—') + '</option>';
        }).join('') + '</select></td>' +
        '<td>' + esc(m.group) + '</td></tr>';
    }).join('');
    var counts = { Present: 0, Late: 0, Absent: 0, Excused: 0, Unmarked: 0 };
    day.members.forEach(function (m) { counts[statusOf(m) || 'Unmarked']++; });
    $('summary').innerHTML = Object.keys(counts).map(function (k) {
      return '<span class="pill">' + k + ': ' + counts[k] + '</span>';
    }).join('');
  }

  function setStatus(id, status) {
    var m = day.members.filter(function (x) { return x.id === id; })[0];
    if (m.status === status) delete edits[id]; else edits[id] = status;
  }

  function edit(sel) { setStatus(sel.getAttribute('data-id'), sel.value); renderTable(); }

  function bulkSet(status) {
    visibleMembers().forEach(function (m) { if (!statusOf(m)) setStatus(m.id, status); });
    renderTable();
  }

  function saveDay() {
    var records = Object.keys(edits).map(function (id) { return { id: id, status: edits[id] }; });
    if (!records.length) { setMsg($('admin-msg'), 'warn', 'No changes to save.'); return; }
    $('save-btn').disabled = true;
    google.script.run
      .withSuccessHandler(function (r) {
        $('save-btn').disabled = false;
        edits = {};
        setMsg($('admin-msg'), 'ok', 'Saved ' + r.saved + ' change(s) to the sheet.');
        loadDayQuiet();
      })
      .withFailureHandler(function (e) {
        $('save-btn').disabled = false;
        setMsg($('admin-msg'), 'err', errText(e));
      })
      .adminSaveDay($('pin').value, day.date, records);
  }

  function loadDayQuiet() {
    google.script.run.withSuccessHandler(function (d) { day = d; renderTable(); })
      .adminGetDay($('pin').value, day.date);
  }
</script>
</body>
</html>
